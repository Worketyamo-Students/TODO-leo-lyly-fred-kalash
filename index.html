<!DOCTYPE html>
<html lang="en" class="text-[10px]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>TODO App</title>
    <link rel="stylesheet" href="/dist/output.css">
    <link rel="stylesheet" href="./src/input.css">
    <!-- pour importer le lien du font family -->
    <script>
        window.onload = () => {
           const darkModeToggle = document.getElementById("dark-mode-toggle");
           darkModeToggle.addEventListener("click", () => {
               if (document.body.classList.contains("dark")) {
                   document.body.classList.remove("dark");
               } else {
                   document.body.classList.add("dark");
               }
           });
       }
   </script>

</head>
<body  class="w-[100vw] h-[100vh] bg-[white] dark:bg-[#161721] overflow-hidden box-border flex flex-col items-center gap-[1rem]">
    <header class="w-full h-[20rem] bg-[url('../assets/imgs/herosection.svg')] dark:bg-[url('../assets/imgs/darkherosection.svg')]  bg-cover bg-no-repeat">
        <nav class="w-full h-[20rem] bg-gradient-to-bl from-[#5596FF] to-[#AC2DEB] opacity-80 flex items-start justify-center">
            <div class="pt-[2rem] w-[32.7rem] flex justify-between items-center ">
                <span class="text-[white] text-[4rem] font-[700] tracking-[1.5rem]">TODO</span>
                <button id="dark-mode-toggle" class="cursor-pointer flex items-center justify-center size-[3rem]">
                    <span class="inline dark:hidden">
                         <img src="./assets/imgs/lune.svg" alt="light-mode">
                    </span>
                    <span class="hidden dark:inline">
                         <img src="./assets/imgs/soleil.svg" alt="Dark-mode">
                    </span>
                 </button>
            </div>
        </nav>
    </header>
    <!-- ajoutons ici la section portant notre input -->
    <div class="w-[32.7rem] bg-[white] dark:bg-[#25273D] top-[10.8rem] absolute rounded-[0.5rem] flex items-center px-[2rem] py-[1.4rem] gap-[1.2rem]">
        <div class="w-[2.2rem] h-[2.2rem] rounded-[50%] bg-[gray] hover:bg-gradient-to-br from-[#55DDFF] to-[#C058F3] flex items-center justify-center">
            <div class="w-[2rem] h-[2rem] rounded-[50%] bg-[white] dark:bg-[#25273D] flex items-center justify-center">
                <img class="w-[2rem] h-[2rem] opacity-0" id="input_check" src="assets/imgs/check.svg" alt="image coché">
            </div>
        </div>
        <input class="outline-none w-[80%] text-[1.2rem] font-[400] bg-[white] dark:bg-[#25273D] text-[black] dark:text-[#767992]" placeholder="Create a new todo…"  type="text" name="text" id="input">
    </div>
    <!-- ici rajoutons la section de tache  -->
    <div class="w-[32.7rem] mb-[4.4rem] rounded-[0.5rem] absolute top-[17rem] flex flex-col gap-[1.6rem]">
        <div class="dark:bg-[#393A4B] w-[100%] overflow-y-scroll  h-[auto] max-h-[26rem] rounded-[0.5rem] dark:shadow-[0px_35px_50px_-15px_##0F1017] shadow-[0px_35px_50px_-15px_#C2C3D680]" id="blocTache"><!-- hidden this -->
            <div class="w-[100%] bg-[white] dark:bg-[#25273D] flex items-center justify-between px-[2rem] py-[1.4rem] gap-[1.2rem]  border-b-2 border-[#D1D2DA]" id="taskcontainer">
                <div class="flex items-center gap-[1.2rem]"id="newtask">
                    <div class="w-[2.2rem] h-[2.2rem] rounded-[50%] bg-[gray] dark:bg-[#393A4B] hover:bg-gradient-to-br from-[#55DDFF] to-[#C058F3] flex items-center justify-center" id="circle_border">
                        <div class="w-[2rem] h-[2rem] rounded-[50%] bg-[white] dark:bg-[#25273D] flex items-center justify-center cursor-[pointer]" id="circle">
                            <img class="w-[2rem] h-[2rem] opacity-0" id="image_click" src="assets/imgs/check.svg" alt="image coché">
                        </div>
                    </div>
                    <span class="text-[black] font-[400] text-[1.8rem]  max-w-[22rem] overflow-x-scroll dark:text-[#4D5067]" id="task_text">nouvelle tache</span>
                </div>
                <div class="flex items-center justify-center size-[1.2rem]" id="cross_container">
                    <img class="cursor-[pointer]" src="./assets/imgs/cross.svg" alt="effacer" id="cross">
                </div>
            </div>
            <!-- ici c'est le bloc qui porte le compteur de tache -->
            <div class="w-[32.7rem] bg-[white] dark:bg-[#25273D] flex items-center justify-between px-[2rem] py-[1.4rem]" id="blocCompteur">
                <div class="flex items-center gap-[0.2rem] font-[400] text-[#9495A5] dark:text-[#5B5E7E] text-[1.2rem]">
                    <p id="compteur">0</p>
                    <span>item(s) left(s)</span>
                </div>
                <span class="font-[400] text-[#9495A5] dark:text-[#5B5E7E] text-[1.2rem] cursor-default" id="clear">
                    Clear Completed
                </span>
            </div>
            <!-- il y'a un dernier ajusrement a faire ici -->
        </div>
        <div class="rounded-[0.5rem] bg-[white] dark:bg-[#25273D] flex items-center justify-center gap-[1.8rem] shadow-[0px_35px_50px_-15px_#16172180] dark:shadow-[0px_35px_50px_-15px_##0F1017] py-[1.5rem]">
            <span class="hover:text-[#3A7CFD] text-[#3A7CFD] dark:text-[#5B5E7E] font-[700] cursor-[pointer] text-[1.4rem]" id="all">All</span>
            <span class="hover:text-[#3A7CFD] text-[#9495A5] dark:text-[#5B5E7E] font-[700] cursor-[pointer] text-[1.4rem]" id="active">Active</span>
            <span class="hover:text-[#3A7CFD] text-[#9495A5] dark:text-[#5B5E7E] font-[700] cursor-[pointer] text-[1.4rem]" id="completed">Completed</span>
        </div>
    <span class="text-[#9495A5] dark:text-[#5B5E7E] mt-[5.4rem] text-center  font-[700] text-[1.4rem]">Drag and drop to reorder list</span>  
    </div>
    <!-- <script src="assets/script/script.js"></script> -->
    <script src="assets/script/scrip.js"></script>
</body>
</html>
